<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mealie</title>
    <meta data-hid="og:type" property="og:type" content="website" />
    <meta data-hid="og:title" property="og:title" content="Mealie" />
    <meta data-hid="og:site_name" property="og:site_name" content="Mealie" />
    <meta data-hid="og:description" property="og:description" content="Mealie is a recipe management app for your kitchen." />
    <meta
      data-hid="og:image"
      property="og:image"
      content="https://raw.githubusercontent.com/mealie-recipes/mealie/9571816ac4eed5beacfc0abf6c03eff1427fd0eb/frontend/static/icons/android-chrome-512x512.png"
    />
    <meta name="description" content="Mealie is a recipe management app for your kitchen." />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" type="image/png" href="/icons/icon-x64.png" />
    <link rel="apple-touch-icon" type="image/png" href="/icons/apple-touch-icon.png" />
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <script>
      // Paint the right background before the bundle loads, to avoid a white flash in dark mode.
      // Same storage key as the Vue app so existing preferences carry over.
      (function () { try { var d = localStorage.getItem("vueuse-color-scheme"); var m = d === "dark" || (d !== "light" && matchMedia("(prefers-color-scheme:dark)").matches); document.documentElement.style.backgroundColor = m ? "#1E1E1E" : "#FFFFFF"; } catch (e) {} })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
